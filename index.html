function decodeHtml(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

const customerFrame = document.getElementById("customerFrame");
const adminFrame = document.getElementById("adminFrame");
const workspace = document.getElementById("workspace");
const loading = document.getElementById("loading");
let customerLoaded = false;
let adminLoaded = false;
const parentRelaySeen = new Set();
function parentEventKey(data) {
  if (!data || typeof data !== 'object') return '';
  return data.eventId || data.requestId || data.clientEventId || data.registrationId || '';
}
function shouldRelayParent(data) {
  const key = parentEventKey(data);
  if (!key) return true;
  if (parentRelaySeen.has(key)) return false;
  parentRelaySeen.add(key);
  if (parentRelaySeen.size > 5000) parentRelaySeen.delete(parentRelaySeen.values().next().value);
  return true;
}

function loadFrames() {
  if (!customerLoaded) {
    customerFrame.srcdoc = decodeHtml(CUSTOMER_HTML_B64);
    customerLoaded = true;
  }
  if (!adminLoaded) {
    adminFrame.srcdoc = decodeHtml(ADMIN_HTML_B64);
    adminLoaded = true;
  }
}

function showFrame(which) {
  const customer = which === "customer";
  customerFrame.classList.toggle("active", customer);
  adminFrame.classList.toggle("active", !customer);
}

function openCustomer() {
  loadFrames();
  showFrame("customer");
}

function openAdmin() {
  loadFrames();
  showFrame("admin");
}

function gatewayLogout() {
  sessionStorage.removeItem("kryp_unified_role");
  sessionStorage.removeItem("kryp_unified_logged_in");
  sessionStorage.removeItem("kryp_admin_auth_v4");
  adminFrame.contentWindow?.postMessage({type:"ADMIN_AUTH_REVOKED"},"*");
  customerFrame.contentWindow?.postMessage({type:"ADMIN_AUTH_REVOKED"},"*");
  customerFrame.srcdoc = decodeHtml(CUSTOMER_HTML_B64);
  customerLoaded = true;
  openCustomer();
}

const crossTabChannel = ("BroadcastChannel" in window)
  ? new BroadcastChannel("krypcoin_admin_engine_v4")
  : null;

function relayToFrames(data, sourceWindow) {
  if (!shouldRelayParent(data)) return;
  [customerFrame, adminFrame].forEach(frame => {
    if (!frame || !frame.contentWindow || frame.contentWindow === sourceWindow) return;
    frame.contentWindow.postMessage({type:"KRYPCOIN_CHANNEL_IN",data:data},"*");
  });
}

if (crossTabChannel) {
  crossTabChannel.onmessage = event => {
    if (event.data) relayToFrames(event.data, null);
  };
}

window.addEventListener("message", event => {
  if (!event.data || typeof event.data !== "object") return;

  if (event.data.type === "ADMIN_LOGIN_SUCCESS" || event.data.type === "ADMIN_AUTH_GRANTED") {
    sessionStorage.setItem("kryp_unified_role","admin");
    sessionStorage.setItem("kryp_unified_logged_in","true");
    sessionStorage.setItem("kryp_admin_auth_v4","1");
    openAdmin();
    setTimeout(()=>adminFrame.contentWindow?.postMessage({type:"ADMIN_AUTH_GRANTED"},"*"),100);
    return;
  }

  if (event.data.type === "ADMIN_READY_FOR_AUTH") {
    if (sessionStorage.getItem("kryp_admin_auth_v4") === "1") {
      event.source?.postMessage({type:"ADMIN_AUTH_GRANTED"},"*");
    }
    return;
  }

  if (event.data.type === "KRYPCOIN_CHANNEL_OUT") {
    const data = event.data.data;
    if (!data) return;
    relayToFrames(data, event.source);
    if (crossTabChannel) crossTabChannel.postMessage(data);
  }
});

const KRYP_RAILWAY_WS_URL='wss://reasonable-nurturing-production-943b.up.railway.app/ws';
const KRYP_RAILWAY_API_URL='https://reasonable-nurturing-production-943b.up.railway.app';
function remoteConfig(){
  let wsUrl=KRYP_RAILWAY_WS_URL,apiUrl=KRYP_RAILWAY_API_URL,adminToken='',customerToken='';
  try{
    wsUrl=localStorage.getItem('kryp_remote_ws_url')||KRYP_RAILWAY_WS_URL;
    apiUrl=localStorage.getItem('kryp_remote_api_url')||KRYP_RAILWAY_API_URL;
    adminToken=localStorage.getItem('kryp_remote_admin_token')||localStorage.getItem('kryp_remote_token')||'';
    customerToken=localStorage.getItem('kryp_remote_customer_token')||localStorage.getItem('kryp_remote_token')||'';
  }catch(e){}
  return {type:'KRYP_V6_CONFIG',wsUrl,apiUrl,adminToken,customerToken};
}
function sendRemoteConfig(frame){try{frame?.contentWindow?.postMessage(remoteConfig(),'*')}catch(e){}}
window.addEventListener('message',event=>{
  const d=event.data||{};
  if(d.type==='KRYP_V6_REQUEST_CONFIG'){
    const role=d.role==='admin'?'admin':'customer';
    sendRemoteConfig(role==='admin'?adminFrame:customerFrame);
  }
});
window.addEventListener("load", () => {
  loadFrames();
  openCustomer();
  setTimeout(()=>{sendRemoteConfig(customerFrame);sendRemoteConfig(adminFrame)},250);
  setInterval(()=>{sendRemoteConfig(customerFrame);sendRemoteConfig(adminFrame)},5000);
});

</script>

<script id="kryp-v5-parent-upgrade">
(function(){
 if(window.__KRYP_V5_PARENT__)return;window.__KRYP_V5_PARENT__=true;
 const CH='krypcoin_admin_engine_v5_full';let bc=null,last=Date.now();
 try{bc=new BroadcastChannel(CH)}catch(e){}
 function relay(data,source){if(!shouldRelayParent(data)) return;last=Date.now();[customerFrame,adminFrame].forEach(f=>{if(f&&f!==source)try{f.contentWindow.postMessage({type:'KRYPCOIN_CHANNEL_IN',data},'*')}catch(e){}});try{bc&&bc.postMessage({type:'KRYP_V5_RELAY',data})}catch(e){}}
 addEventListener('message',e=>{let d=e.data||{};if(d.type==='KRYPCOIN_CHANNEL_OUT')relay(d.data,e.source);if(d.type==='KRYPCOIN_HEARTBEAT')last=Date.now()});
 if(bc)bc.onmessage=e=>{let d=e.data||{};if(d.type==='KRYP_V5_RELAY')relay(d.data,null)};
 setInterval(()=>{document.documentElement.dataset.krypConnection=(Date.now()-last<12000)?'connected':'waiting'},3000);
})();
</script>
<script id="kryp-v6-parent-realtime-config">
(function(){
 if(window.__KRYP_V6_PARENT_REMOTE__)return; window.__KRYP_V6_PARENT_REMOTE__=true;
 const statusKey='kryp_remote_connected';
 function relayToFramesV6(data, sourceWindow){
   if(!shouldRelayParent(data)) return;
   [customerFrame,adminFrame].forEach(frame=>{if(frame&&frame.contentWindow&&frame.contentWindow!==sourceWindow){try{frame.contentWindow.postMessage({type:'KRYPCOIN_CHANNEL_IN',data},'*')}catch(e){}}});
 }
 window.addEventListener('message',e=>{
   const d=e.data||{};
   if(d.type==='KRYPCOIN_CHANNEL_OUT'&&d.data){relayToFramesV6(d.data,e.source);}
   if(d.type==='KRYPCOIN_REMOTE_STATUS'){try{localStorage.setItem(statusKey,d.connected?'true':'false')}catch(x){}}
 });
 window.addEventListener('load',()=>{setTimeout(()=>{try{sendRemoteConfig(customerFrame);sendRemoteConfig(adminFrame)}catch(e){}},500)});
})();
</script>
